<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Hors ligne – Clinique Croix Bleue</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #f8fafc; color: #111827; text-align: center; }
      main { max-width: 28rem; }
      h1 { font-size: 1.25rem; }
      p { color: #4b5563; line-height: 1.5; }
      button { margin-top: 1rem; border: 0; border-radius: 0.5rem; padding: 0.625rem 1rem; background: #2563eb; color: #fff; font-weight: 600; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Prise de rendez-vous en ligne – Clinique Croix Bleue</h1>
      <p>Vous êtes hors ligne. Vérifiez votre connexion Internet, puis réessayez.</p>
      <p>Vous pouvez toujours vous présenter directement à l'accueil de la clinique, sans rendez-vous.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
